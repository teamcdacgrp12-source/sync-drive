spring.application.name=chat-service
server.port=8083

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

app.security.validate-room-access=false

# Private room assistant. Keep the real key in the OPENAI_API_KEY environment
# variable; never place it in this file or frontend code.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-sol}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.data.redis=INFO
logging.level.com.syncdrive.chat=DEBUG

# \uD83D\uDD34 FIX: Force Chat Service to use IP Address too
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
